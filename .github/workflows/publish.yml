# Publish @hellocoop/emdash to npm with provenance.
#
# Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN
# secret. npmjs.com must have a trusted publisher configured for this package
# pointing at this repository and this workflow filename (publish.yml); see
# "Cutting a release" in the README.
#
# Provenance requires a PUBLIC source repository. npm rejects the publish with
# a 422 ("Only public source repositories are supported when publishing with
# provenance") from a private one.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token npm exchanges for publish rights
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, which Node 24 does not
      # necessarily bundle.
      - name: Use a trusted-publishing-capable npm
        run: npm install -g npm@latest

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      # --provenance is redundant under trusted publishing, which attests
      # automatically, but it makes the publish fail loudly rather than ship
      # an unattested tarball if the OIDC exchange silently falls back.
      - run: npm publish --provenance --access public
